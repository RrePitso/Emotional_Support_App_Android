# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# The settings configured through the IDE will override settings specified here.
# For more details on configuring your build environment, see
# https://docs.gradle.org/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX and Kotlin settings
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
kapt.verbose=true

# Render backend URL used to generate BuildConfig.BACKEND_BASE_URL.
# Keep the trailing slash because Retrofit requires it.
backendBaseUrl=https://emotional-support-backend.onrender.com/
